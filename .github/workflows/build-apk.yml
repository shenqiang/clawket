name: Build Clawket APK (no GMS)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      # office-game 子项目需要先构建（App.tsx 引用其 dist/office-inline.js）
      # 等效于 eas-build-post-install 钩子
      - name: Build office-game
        working-directory: apps/mobile/office-game
        run: |
          npm install
          npm run build

      - name: Generate self-signed release keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/clawket-release.keystore \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass clawketpass123 \
            -keypass clawketpass123 \
            -dname "CN=Clawket Self-Hosted, OU=Dev, O=Clawket, L=Shanghai, ST=Shanghai, C=CN"

      # 关键：不设置任何 EXPO_PUBLIC_REVENUECAT_* / EXPO_PUBLIC_POSTHOG_*
      # 源码逻辑：未配置 → 跳过订阅计费 → 默认解锁 Pro → 不初始化 Google Play Billing
      - name: Build release APK (no RevenueCat / no GMS)
        working-directory: apps/mobile
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          CLAWKET_ANDROID_KEYSTORE_PATH: /tmp/clawket-release.keystore
          CLAWKET_ANDROID_KEY_ALIAS: upload
          CLAWKET_ANDROID_KEYSTORE_PASSWORD: clawketpass123
          CLAWKET_ANDROID_KEY_PASSWORD: clawketpass123
          EXPO_PUBLIC_REVENUECAT_ENABLED: ""
          EXPO_PUBLIC_POSTHOG_ENABLED: ""
        run: bash scripts/build-android-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clawket-no-gms-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
