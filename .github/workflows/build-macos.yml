name: Build Clawket macOS (Catalyst, no RevenueCat)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-15 = Apple Silicon (arm64) → 产出原生 arm64 app，M2 直接运行
    # Xcode 16+ 默认（RN 0.83 需要 Xcode 16，macos-14 默认 15.4 会失败）
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # 确保用最新 Xcode（RN 0.83 要求 Xcode 16+）
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || \
          echo "Xcode 16 not found at standard paths, using default"
          xcodebuild -version

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      # 修复 react-native-bottom-tabs Catalyst 兼容：
      # 1.1.0 引用 iOS 26 专属类型导致 Catalyst 编译失败，1.4.0 已修复（compiler>=6.2 保护）
      - name: Upgrade react-native-bottom-tabs (Catalyst fix)
        working-directory: apps/mobile
        run: npm install react-native-bottom-tabs@^1.4.0

      - name: Build office-game assets (mobile:prepare)
        run: npm run mobile:prepare

      # 生成 iOS 原生工程（Mac Catalyst 构建依赖 ios/ 目录）
      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      # 修复 expo-sharing-extension 的 Swift 6 并发错误（EAS appExtensions 生成代码）
      - name: Patch share extension (Swift 6 concurrency)
        working-directory: apps/mobile
        run: |
          perl -0pi -e 's/(\n\s*)private func copyAndProcessFile\(/$1@MainActor\n$1private func copyAndProcessFile(/' ios/expo-sharing-extension/ShareIntoViewController.swift
          perl -0pi -e 's/(\n\s*)private func saveDataToAppGroup\(/$1@MainActor\n$1private func saveDataToAppGroup(/' ios/expo-sharing-extension/ShareIntoViewController.swift
          perl -0pi -e 's/let result = self\.copyAndProcessFile\(url: url, type: type\)/let result = MainActor.assumeIsolated { self.copyAndProcessFile(url: url, type: type) }/g' ios/expo-sharing-extension/ShareIntoViewController.swift
          perl -0pi -e 's/let result = self\.saveDataToAppGroup\(data: data, fileName: fileName, type: type, mimeType: mimeType\)/let result = MainActor.assumeIsolated { self.saveDataToAppGroup(data: data, fileName: fileName, type: type, mimeType: mimeType) }/g' ios/expo-sharing-extension/ShareIntoViewController.swift
          perl -0pi -e 's/return self\.saveDataToAppGroup\(data: data, fileName: fileName, type: type, mimeType: mimeType\)/return MainActor.assumeIsolated { self.saveDataToAppGroup(data: data, fileName: fileName, type: type, mimeType: mimeType) }/g' ios/expo-sharing-extension/ShareIntoViewController.swift
          perl -0pi -e 's/return self\.copyAndProcessFile\(url: url, type: type\)/return MainActor.assumeIsolated { self.copyAndProcessFile(url: url, type: type) }/g' ios/expo-sharing-extension/ShareIntoViewController.swift
          grep -c "MainActor" ios/expo-sharing-extension/ShareIntoViewController.swift

      # 关键：不设置 EXPO_PUBLIC_REVENUECAT_ENABLED → 自动解锁 Pro（多连接免费）
      # MACOS_ALLOW_SIGNING 默认 0 → 无需 Apple 开发者签名
      # 修复 Swift 编译问题：
      # - expo-modules-core 55 使用 `extension X: @MainActor P` 语法（SE-0449，Swift 6.1+）
      #   → 必须用 Swift 6 语言模式编译（Swift 5 不认识该语法）
      # - 但 Swift 6 默认严格并发检查，expo 55 旧代码有 24 处并发错误
      #   → 同时注入 SWIFT_STRICT_CONCURRENCY=minimal 放宽并发检查
      # 两者组合：SWIFT_VERSION=6 + SWIFT_STRICT_CONCURRENCY=minimal
      - name: Patch build script (Swift 6 + relaxed concurrency)
        working-directory: apps/mobile
        run: |
          perl -pi -e 's/CODE_SIGNING_REQUIRED=NO/CODE_SIGNING_REQUIRED=NO SWIFT_VERSION=6.0 SWIFT_STRICT_CONCURRENCY=minimal/' scripts/build-macos.sh
          grep -n "SWIFT_VERSION" scripts/build-macos.sh

      - name: Build Mac Catalyst app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_REVENUECAT_ENABLED: ""
          EXPO_PUBLIC_POSTHOG_ENABLED: ""
          MACOS_ALLOW_SIGNING: "0"
        run: npm run build:macos

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: clawket-macos-catalyst
          path: /tmp/clawket-mac-build/Build/Products/Release-maccatalyst/Clawket.app
          if-no-files-found: error
