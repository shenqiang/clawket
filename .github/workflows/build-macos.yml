name: Build Clawket macOS (Catalyst, no RevenueCat)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # macos-15 = Apple Silicon (arm64) → 产出原生 arm64 app，M2 直接运行
    # Xcode 16+ 默认（RN 0.83 需要 Xcode 16，macos-14 默认 15.4 会失败）
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      # 确保用最新 Xcode（RN 0.83 要求 Xcode 16+）
      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.2.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.1.app 2>/dev/null || \
          sudo xcode-select -s /Applications/Xcode_16.0.app 2>/dev/null || \
          echo "Xcode 16 not found at standard paths, using default"
          xcodebuild -version

      - name: Install dependencies
        working-directory: apps/mobile
        run: npm install

      # 修复 react-native-bottom-tabs Catalyst 兼容：
      # 1.1.0 引用 iOS 26 专属类型导致 Catalyst 编译失败，1.4.0 已修复（compiler>=6.2 保护）
      - name: Upgrade react-native-bottom-tabs (Catalyst fix)
        working-directory: apps/mobile
        run: npm install react-native-bottom-tabs@^1.4.0

      - name: Build office-game assets (mobile:prepare)
        run: npm run mobile:prepare

      # 生成 iOS 原生工程（Mac Catalyst 构建依赖 ios/ 目录）
      # 先给 app.json 加 supportsMac，让 prebuild 生成 Catalyst 支持的工程
      - name: Enable Catalyst in app.json
        working-directory: apps/mobile
        run: python3 ../../scripts/enable-catalyst.py

      - name: Expo prebuild (ios)
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      # 给 Clawket target 加 SUPPORTS_MACCATALYST=YES（Expo supportsMac 字段不生效）
      - name: Patch pbxproj (enable Catalyst)
        working-directory: apps/mobile
        run: python3 ../../scripts/patch-pbxproj-catalyst.py

      # UIRefreshControl Catalyst 崩溃终极修复：patch AppDelegate.swift 注入 swizzle
      # （AppDelegate 是主 target 必然编译，比 pbxproj 注入 .m 可靠）
      - name: Patch UIRefreshControl swizzle (Catalyst crash fix)
        working-directory: apps/mobile
        run: python3 ../../scripts/patch-refreshcontrol-appdelegate.py

      # 预案 B：patch app 源码，Catalyst 下禁用所有 RefreshControl（双保险）
      # app 源码被 Metro 强制追踪，改动必然进 bundle（比 patch node_modules 可靠）
      - name: Patch app source (disable RefreshControl, plan B)
        run: python3 ../../scripts/patch-app-refreshcontrol.py
        working-directory: apps/mobile

      # 中间检查点：确认两个 patch 都落在正确位置（秒级 fail fast）
      - name: Verify patches applied (fail fast)
        working-directory: apps/mobile
        run: |
          echo "=== AppDelegate swizzle ==="
          grep -c "hermes_safeDidMoveToSuperview" ios/Clawket/AppDelegate.swift && echo "✅ swizzle 已注入" || { echo "❌ swizzle 缺失"; exit 1; }
          grep -c "hermesInstallCatalystRefreshFix" ios/Clawket/AppDelegate.swift || { echo "❌ install 调用缺失"; exit 1; }
          echo "=== app 源码 RefreshControl patch ==="
          N=$(grep -rl "refreshControl={__CATALYST__ ? null" ../../apps/mobile/src 2>/dev/null | wc -l)
          echo "已 patch 文件数: $N"
          [ "$N" -ge 20 ] || { echo "❌ patch 文件数过少: $N"; exit 1; }
          grep -c "__CATALYST__" ../../apps/mobile/index.ts && echo "✅ __CATALYST__ 已注入入口" || { echo "❌ 入口缺 __CATALYST__"; exit 1; }
          echo "✅ 所有 patch 验证通过"

      # 修复 expo-sharing-extension 的 Swift 6 并发错误：
      # EAS appExtensions 生成的 ShareIntoViewController 的 loadItem 完成回调是
      # nonisolated @Sendable 闭包，内部同步调用 MainActor 方法导致 Swift 6 报错。
      # 修复：整个数据处理链 nonisolated（基于真实模板源码的精确补丁）
      - name: Patch share extension (Swift 6 concurrency)
        working-directory: apps/mobile
        run: python3 ../../scripts/patch-share-mainactor.py

      # 修复 expo-modules-core 的 SE-0449 语法（Swift 6.1+ 专属）：
      # `extension X: @MainActor P` 在 Swift 5 模式下不认识。
      # 该补丁已注入 build-macos.sh 内部（npm install 之后执行），无需独立步骤
      # 修复 RevenueCat SDK 的 Swift 6 并发错误：
      # RevenueCat 旧版本在 Swift 6 语言模式下有 100+ 处 static property Sendable 错误。
      # 方案：全局 Swift 5 编译（见下）+ expo SE-0449 补丁后，RevenueCat 自动通过。
      # 这里保留 Podfile 钩子作为双保险（如果还有 pod 报错可扩展）
      - name: Patch Podfile (RevenueCat Swift 5 mode)
        working-directory: apps/mobile
        run: python3 ../../scripts/patch-podfile-revenuecat.py

      # 关键：不设置 EXPO_PUBLIC_REVENUECAT_ENABLED → 自动解锁 Pro（多连接免费）
      # MACOS_ALLOW_SIGNING 默认 0 → 无需 Apple 开发者签名
      # 修复 Swift 编译问题：
      # - 全局 SWIFT_VERSION=5.0（RevenueCat 旧版 100+ 处 Sendable 错误降为 warning）
      # - build-macos.sh 内部会 npm install 重置 node_modules，SE-0449 补丁
      #   注入到脚本里，在 npm install 之后执行才能生效
      - name: Patch build script (Swift 5 + SE-0449 inline)
        working-directory: apps/mobile
        run: python3 ../../scripts/patch-build-script.py

      # 诊断：确认补丁落点（bundle 用的 react-native 源码路径）
      - name: Verify patch targets exist
        run: |
          echo "=== node_modules 布局 ==="
          ls -d node_modules/react-native 2>/dev/null && echo "根: node_modules/react-native ✓" || echo "根: 无"
          ls -d apps/mobile/node_modules/react-native 2>/dev/null && echo "mobile: node_modules/react-native ✓" || echo "mobile: 无"
          echo "=== ScrollView.js 补丁状态 ==="
          for p in node_modules apps/mobile/node_modules; do
            f="$p/react-native/Libraries/Components/ScrollView/ScrollView.js"
            [ -f "$f" ] && echo "$f: $(grep -c 'Hermes catalyst patch' "$f" 2>/dev/null) 处补丁" || true
          done
          echo "=== RefreshControl.js 补丁状态 ==="
          for p in node_modules apps/mobile/node_modules; do
            f="$p/react-native/Libraries/Components/RefreshControl/RefreshControl.js"
            [ -f "$f" ] && echo "$f: $(grep -c 'Hermes catalyst patch' "$f" 2>/dev/null) 处补丁" || true
          done

      - name: Build Mac Catalyst app
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_REVENUECAT_ENABLED: ""
          EXPO_PUBLIC_POSTHOG_ENABLED: ""
          MACOS_ALLOW_SIGNING: "0"
        run: npm run build:macos

      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: clawket-macos-catalyst
          # iOS app on Mac（Designed for iPad/iPhone）产物在 Release-iphoneos
          path: |
            /tmp/clawket-mac-build/Build/Products/Release-iphoneos/Clawket.app
            /tmp/clawket-mac-build/Build/Products/Release-maccatalyst/Clawket.app
          if-no-files-found: error
